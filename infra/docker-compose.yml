# SpeechToNote — full local stack.
#
#   up:   docker compose -f infra/docker-compose.yml --env-file infra/.env up -d --build
#   down: docker compose -f infra/docker-compose.yml --env-file infra/.env down
#
# MongoDB is internal to this network and publishes no host port, so it cannot
# collide with a MongoDB you already run on 27017.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: ../backend/speech-to-note-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      CURRENT_ENV: docker
      MONGO_URI: mongodb://mongo:27017
      DATABASE_NAME: ${DATABASE_NAME:-speechtonote}
      DEBUG: ${BACKEND_DEBUG:-false}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/speaker_notes/')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_CONFIG_ENV_FRONT: local_docker
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Injected at container start — never baked into an image layer.
      GCP_API_KEY: ${GCP_API_KEY:-}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"

volumes:
  mongo_data: